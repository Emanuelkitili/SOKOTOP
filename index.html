<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SOKOTOP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="mainApp">
<div class="header"><div class="logo">SOKOTOP</div><div>🔔 <span id="notifCount"></span></div></div>

<!-- TOP NAV -->
<div class="top-nav">
<div onclick="showSection('home',this)" class="active">🏠 Home</div>
<div onclick="showSection('requests',this)">📩 Requests</div>
<div onclick="showSection('polls',this)">📊 Polls</div>
<div onclick="showSection('friends',this)">👥 Friends</div>
</div>

<!-- TV -->
<div class="tv-container">
<div class="tv-label" id="tvLabel"><span>📺 SOKOTOP TV - LIVE ADS</span><span id="tvCount"></span></div>
<div id="tvScreen"><div class="waiting-msg">📺 No ads yet - Admin will post soon</div></div>
<div class="tv-dots" id="tvDots"></div>
</div>

<!-- LIVE INTERACTION - Only when Live is ON -->
<div id="liveInteract" class="live-box" style="display:none">
<div class="live-top"><button class="like-btn" onclick="likeLive()">❤️ Like <span id="likeCount">0</span></button><span class="watching">👁️ <span id="viewCount">1,245</span> Watching</span></div>
<div id="liveComments" class="live-comments"></div>
<div class="live-input-row"><input id="liveCommentInput" placeholder="Ask Mheshimiwa a question..."><button class="send-btn" onclick="sendLiveComment()">Send</button></div>
</div>

<!-- TICKER -->
<div class="ticker-bar"><div class="ticker-label">LIVE</div><div class="ticker-viewport"><div class="ticker-track" id="tickerTrack"><span>Welcome to SOKOTOP - Kitui's Own App 🔥</span><span>Welcome to SOKOTOP - Kitui's Own App 🔥</span></div></div></div>

<!-- HOME -->
<div id="sec-home" class="section active">
<div class="create-post">
<textarea id="postText" placeholder="What's happening in Kitui?"></textarea>
<label class="gallery-btn">📷 / 🎥 Choose Photo or Video<input type="file" id="postFile" accept="image/*,video/*"></label>
<div id="postPreview"></div>
<button class="btn-post" onclick="doPost()">🚀 POST</button>
</div>
<div id="feed"></div>
</div>

<!-- REQUESTS -->
<div id="sec-requests" class="section"><div class="pad"><h3>📩 Requests</h3><input id="reqText" placeholder="What do you need? e.g. I need a plumber in Kitui"><input id="reqPhone" placeholder="Your WhatsApp number e.g. 0712345678"><button class="btn-post" onclick="doRequest()">Send Request</button><div id="reqList"></div></div></div>

<!-- POLLS -->
<div id="sec-polls" class="section"><div class="pad"><h3>📊 Polls</h3><input id="pollQ" placeholder="Question e.g. Best team in Kitui?"><input id="pollO1" placeholder="Option 1"><input id="pollO2" placeholder="Option 2"><button class="btn-post" onclick="doPoll()">Create Poll</button><div id="pollList"></div></div></div>

<!-- FRIENDS -->
<div id="sec-friends" class="section"><div class="pad"><h3>👥 Friends</h3><input id="friendSearch" placeholder="Search friends..." oninput="renderFriends()"><div id="friendList"></div></div></div>

<!-- REELS -->
<div id="sec-reels" class="section"><div class="pad"><h3>🎬 Reels</h3><textarea id="reelText" placeholder="Reel caption..."></textarea><label class="gallery-btn">🎥 Choose Reel Video<input type="file" id="reelFile" accept="video/*,image/*"></label><div id="reelPreview"></div><button class="btn-post" onclick="doReel()">Post My Reel</button><div id="reelList"></div></div></div>

<!-- CHAT -->
<div id="sec-chat" class="section"><div class="pad"><h3>💬 Chat</h3><input id="chatTo" placeholder="Who to chat? Name"><div class="chat-box" id="chatBox"></div><div class="live-input-row"><input id="chatInput" placeholder="Type message..."><button class="send-btn" onclick="sendChat()">Send</button></div></div></div>

<!-- ME -->
<div id="sec-me" class="section">
<div class="profile-head"><div class="big-avatar" id="myAvatar">E</div><h2 id="myName">User</h2><p id="myUser">@user</p></div>
<div class="pad">
<label class="gallery-btn">📷 Change Profile Photo<input type="file" id="profilePicInput" accept="image/*"></label>
<div id="profilePicPreview"></div>
<input id="editName" placeholder="Your Name">
<button class="btn-post" onclick="saveProfile()">Save Profile</button>
<button class="btn-post" onclick="clearAllStorage()" style="background:#ff6b00;margin-top:10px">🧹 CLEAR STORAGE - If Upload Fails</button>
<button class="btn-post" onclick="logout()" style="background:#333;margin-top:10px">Logout</button>
<div id="myPosts"></div>
</div>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<div onclick="showSection('home',this)" class="active"><span class="nav-ico">🏠</span>Home</div>
<div onclick="showSection('reels',this)"><span class="nav-ico">🎬</span>Reels</div>
<div class="nav-center" onclick="showSection('home',this)"><div class="plus-btn">+</div></div>
<div onclick="showSection('chat',this)"><span class="nav-ico">💬</span>Chat</div>
<div onclick="showSection('me',this)"><span class="nav-ico">👤</span>Me</div>
</div>

<script>
// ===== USER =====
let currentUser = JSON.parse(localStorage.getItem('sokotop_user') || 'null');
if(!currentUser){ let n = prompt('Welcome to SOKOTOP! Your Name?') || 'User'; let u = '@' + n.toLowerCase().replace(/[^a-z0-9]/g,'') + Math.floor(Math.random()*99); currentUser = {name:n, user:u, pic:''}; localStorage.setItem('sokotop_user', JSON.stringify(currentUser)); }
function getPosts(){ try{ return JSON.parse(localStorage.getItem('sokotop_posts') || '[]'); }catch(e){ return []; } }
function savePosts(p){ try{ localStorage.setItem('sokotop_posts', JSON.stringify(p)); return true; }catch(e){ alert('❌ STORAGE FULL! Go to Me > CLEAR STORAGE, then try again.'); return false; } }
function getReels(){ try{ return JSON.parse(localStorage.getItem('sokotop_reels') || '[]'); }catch(e){ return []; } }
function getReqs(){ try{ return JSON.parse(localStorage.getItem('sokotop_reqs') || '[]'); }catch(e){ return []; } }
function getPolls(){ try{ return JSON.parse(localStorage.getItem('sokotop_polls') || '[]'); }catch(e){ return []; } }
function getChats(){ try{ return JSON.parse(localStorage.getItem('sokotop_chats') || '[]'); }catch(e){ return []; } }
function getFriends(){ return [{name:'Emanuel Kitili', user:'@emanuel', pic:''},{name:'Kitui Friend', user:'@kitui', pic:''}]; }
function clearAllStorage(){ if(!confirm('Clear ALL posts/reels to free space? Your account stays!')) return; localStorage.removeItem('sokotop_posts'); localStorage.removeItem('sokotop_reels'); localStorage.removeItem('sokotop_reqs'); localStorage.removeItem('sokotop_polls'); localStorage.removeItem('sokotop_chats'); alert('Cleared! Now try posting again!'); location.reload(); }
function logout(){ localStorage.removeItem('sokotop_user'); location.reload(); }

// ===== OLD WORKING FILE LOGIC - NO COMPRESS, NO LIMIT, NO CLONE =====
let reelData = ''; let newPicData = '';
document.getElementById('postFile').addEventListener('change', function(){
  let file = this.files[0]; if(!file) return;
  let rd = new FileReader();
  rd.onload = e => {
    document.getElementById('postPreview').innerHTML = file.type.startsWith('video') ? '<video src="'+e.target.result+'" controls></video>' : '<img src="'+e.target.result+'">';
    document.getElementById('postPreview').dataset.url = e.target.result;
    alert('✅ Photo/Video ready! Now tap POST');
  };
  rd.readAsDataURL(file);
});
document.getElementById('reelFile').addEventListener('change', function(){
  let f = this.files[0]; if(!f) return;
  let rd = new FileReader();
  rd.onload = e => {
    reelData = e.target.result;
    document.getElementById('reelPreview').innerHTML = f.type.startsWith('video') ? '<video src="'+reelData+'" controls style="width:100%;border-radius:10px"></video>' : '<img src="'+reelData+'" style="width:100%;border-radius:10px">';
    alert('✅ Reel ready! Now tap Post My Reel');
  };
  rd.readAsDataURL(f);
});
document.getElementById('profilePicInput').addEventListener('change', function(){
  let file = this.files[0]; if(!file) return;
  let rd = new FileReader();
  rd.onload = e => { newPicData = e.target.result; document.getElementById('profilePicPreview').innerHTML = '<img src="'+newPicData+'" style="width:80px;height:80px;border-radius:50%;object-fit:cover">'; alert('✅ Profile photo ready! Now tap Save Profile'); };
  rd.readAsDataURL(file);
});

// ===== NAV =====
function showSection(id, el){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  document.querySelectorAll('.top-nav div').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.bottom-nav div').forEach(d => d.classList.remove('active'));
  if(el) el.classList.add('active');
  if(id==='home') renderFeed(); if(id==='friends') renderFriends(); if(id==='reels') renderReels(); if(id==='requests') renderReqs(); if(id==='polls') renderPolls(); if(id==='chat') renderChat(); if(id==='me') renderMe();
  window.scrollTo(0,0);
}

// ===== POSTS =====
function doPost(){
  let text = document.getElementById('postText').value.trim();
  let media = document.getElementById('postPreview').dataset.url || '';
  if(!text && !media){ alert('Add text or photo!'); return; }
  let posts = getPosts();
  posts.unshift({id:'p'+Date.now(), name:currentUser.name, user:currentUser.user, text:text, media:media, likes:[], comments:[], time:Date.now()});
  if(!savePosts(posts)) return;
  document.getElementById('postText').value=''; document.getElementById('postPreview').innerHTML=''; document.getElementById('postPreview').dataset.url=''; document.getElementById('postFile').value='';
  alert('Posted! ✅'); renderFeed();
}
function renderFeed(){
  let posts = getPosts(); let feed = document.getElementById('feed');
  if(!posts.length){ feed.innerHTML = '<div class="post-card">No posts yet - Be the first in Kitui! 🔥</div>'; return; }
  feed.innerHTML = posts.map(p => {
    let mediaHtml = '';
    if(p.media){ if(p.media.startsWith('data:video')) mediaHtml = '<video src="'+p.media+'" controls></video>'; else mediaHtml = '<img src="'+p.media+'">'; }
    return '<div class="post-card"><b>'+p.name+'</b> <span class="post-time">'+p.user+' • '+new Date(p.time).toLocaleString()+'</span><div class="post-text">'+(p.text||'')+'</div>'+mediaHtml+'<div class="post-actions"><button class="small-btn" onclick="likePost(\''+p.id+'\')">❤️ '+(p.likes?p.likes.length:0)+'</button><button class="small-btn gray" onclick="commentPost(\''+p.id+'\')">💬 '+(p.comments?p.comments.length:0)+'</button></div><div>'+(p.comments||[]).map(c=>'<div class="comment-row"><b>'+c.name+':</b> '+c.text+'</div>').join('')+'</div></div>';
  }).join('');
}
function likePost(id){ let posts = getPosts(); let p = posts.find(x=>x.id==id); if(!p) return; if(!p.likes) p.likes=[]; let i = p.likes.indexOf(currentUser.user); if(i>=0) p.likes.splice(i,1); else p.likes.push(currentUser.user); savePosts(posts); renderFeed(); }
function commentPost(id){ let t = prompt('Your comment:'); if(!t) return; let posts = getPosts(); let p = posts.find(x=>x.id==id); if(!p) return; if(!p.comments) p.comments=[]; p.comments.push({name:currentUser.name, text:t}); savePosts(posts); renderFeed(); }

// ===== REELS =====
function doReel(){
  let text = document.getElementById('reelText').value.trim();
  if(!reelData){ alert('Pick a video first!'); return; }
  let reels = getReels(); reels.unshift({id:'r'+Date.now(), name:currentUser.name, user:currentUser.user, text:text, media:reelData, likes:0, time:Date.now()});
  try{ localStorage.setItem('sokotop_reels', JSON.stringify(reels)); }catch(e){ alert('❌ STORAGE FULL! Clear in Me!'); return; }
  document.getElementById('reelText').value=''; document.getElementById('reelPreview').innerHTML=''; reelData=''; document.getElementById('reelFile').value=''; alert('Reel Posted! ✅'); renderReels();
}
function renderReels(){
  let reels = getReels(); let el = document.getElementById('reelList');
  if(!reels.length){ el.innerHTML = '<p class="muted-note">No reels yet!</p>'; return; }
  el.innerHTML = reels.map(r => '<div class="reel-card"><b>'+r.name+'</b> <span>'+r.user+'</span><p>'+(r.text||'')+'</p>'+(r.media.startsWith('data:video') ? '<video src="'+r.media+'" controls style="width:100%;border-radius:10px"></video>' : '<img src="'+r.media+'" style="width:100%;border-radius:10px">')+'</div>').join('');
}

// ===== REQUESTS / POLLS / FRIENDS / CHAT / PROFILE =====
function doRequest(){
  let t = document.getElementById('reqText').value.trim(); let ph = document.getElementById('reqPhone').value.trim();
  if(!t){ alert('Write what you need!'); return; }
  let arr = getReqs(); arr.unshift({name:currentUser.name, text:t, phone:ph, time:Date.now()}); localStorage.setItem('sokotop_reqs', JSON.stringify(arr));
  document.getElementById('reqText').value=''; alert('Request sent! ✅'); renderReqs();
}
function renderReqs(){ let arr = getReqs(); document.getElementById('reqList').innerHTML = arr.map(r => '<div class="req-card"><b>'+r.name+'</b><p>'+r.text+'</p><a href="https://wa.me/254'+r.phone.replace(/^0/,'')+'" target="_blank"><button class="small-btn green">WhatsApp</button></a></div>').join('') || '<p class="muted-note">No requests yet</p>'; }
function doPoll(){
  let q = document.getElementById('pollQ').value.trim(); let o1 = document.getElementById('pollO1').value.trim(); let o2 = document.getElementById('pollO2').value.trim();
  if(!q || !o1 || !o2){ alert('Fill all!'); return; }
  let arr = getPolls(); arr.unshift({id:'pl'+Date.now(), q:q, o1:o1, o2:o2, v1:0, v2:0}); localStorage.setItem('sokotop_polls', JSON.stringify(arr)); alert('Poll created! ✅'); renderPolls();
}
function renderPolls(){ let arr = getPolls(); document.getElementById('pollList').innerHTML = arr.map(p => '<div class="poll-card"><b>'+p.q+'</b><button class="poll-opt" onclick="votePoll(\''+p.id+'\',1)"><span>'+p.o1+' - '+p.v1+' votes</span></button><button class="poll-opt" onclick="votePoll(\''+p.id+'\',2)"><span>'+p.o2+' - '+p.v2+' votes</span></button></div>').join('') || '<p class="muted-note">No polls yet</p>'; }
function votePoll(id, n){ let arr = getPolls(); let p = arr.find(x=>x.id==id); if(n==1) p.v1++; else p.v2++; localStorage.setItem('sokotop_polls', JSON.stringify(arr)); renderPolls(); }
function renderFriends(){
  let q = (document.getElementById('friendSearch').value||'').toLowerCase();
  let list = getFriends().filter(f => f.name.toLowerCase().includes(q));
  document.getElementById('friendList').innerHTML = list.map(f => '<div class="friend-card"><div class="avatar">'+f.name[0]+'</div><div style="flex:1"><b>'+f.name+'</b><br><small>'+f.user+'</small></div><button class="small-btn" onclick="showSection(\'chat\',null);document.getElementById(\'chatTo\').value=\''+f.name+'\'">Chat</button></div>').join('');
}
function sendChat(){
  let to = document.getElementById('chatTo').value.trim(); let msg = document.getElementById('chatInput').value.trim();
  if(!msg){ alert('Type message!'); return; }
  let arr = getChats(); arr.push({to:to||'Everyone', from:currentUser.name, text:msg, time:Date.now()}); localStorage.setItem('sokotop_chats', JSON.stringify(arr)); document.getElementById('chatInput').value=''; renderChat();
}
function renderChat(){ let arr = getChats(); document.getElementById('chatBox').innerHTML = arr.map(c => '<div class="msg '+(c.from==currentUser.name?'me':'other')+'"><b>'+c.from+':</b> '+c.text+'</div>').join('') || '<p class="muted-note">No chats yet</p>'; }
function saveProfile(){
  let n = document.getElementById('editName').value.trim();
  if(n) currentUser.name = n;
  if(newPicData) currentUser.pic = newPicData;
  localStorage.setItem('sokotop_user', JSON.stringify(currentUser)); alert('Profile saved! ✅'); renderMe();
}
function renderMe(){
  document.getElementById('myName').textContent = currentUser.name; document.getElementById('myUser').textContent = currentUser.user; document.getElementById('editName').value = currentUser.name;
  document.getElementById('myAvatar').innerHTML = currentUser.pic ? '<img src="'+currentUser.pic+'">' : currentUser.name[0];
  let mine = getPosts().filter(p => p.user==currentUser.user);
  document.getElementById('myPosts').innerHTML = '<h3 style="margin-top:15px">My Posts ('+mine.length+')</h3>' + mine.map(p => '<div class="post-card"><div>'+(p.text||'')+'</div>'+(p.media ? (p.media.startsWith('data:video') ? '<video src="'+p.media+'" controls></video>' : '<img src="'+p.media+'">') : '')+'</div>').join('');
}

// ===== LIVE COMMENTS + LIKES =====
let liveLikes = parseInt(localStorage.getItem('sokotop_likes') || '0');
let liveComments = JSON.parse(localStorage.getItem('sokotop_live_comments') || '[]');
function likeLive(){ liveLikes++; localStorage.setItem('sokotop_likes', liveLikes); document.getElementById('likeCount').innerText = liveLikes; }
function sendLiveComment(){ let t = document.getElementById('liveCommentInput').value.trim(); if(!t) return; liveComments.push({name:currentUser.name, text:t}); localStorage.setItem('sokotop_live_comments', JSON.stringify(liveComments)); document.getElementById('liveCommentInput').value=''; showLiveComments(); }
function showLiveComments(){ document.getElementById('likeCount').innerText = liveLikes; document.getElementById('liveComments').innerHTML = liveComments.slice(-10).map(c=>'<div class="comment-item"><b>'+c.name+':</b> '+c.text+'</div>').join('') || '<div class="empty-text">No questions yet - Ask Mheshimiwa!</div>'; }

// ===== TICKER =====
function loadTicker(){ let t = localStorage.getItem('sokotop_ticker'); if(t){ document.getElementById('tickerTrack').innerHTML = '<span>'+t+'</span><span>'+t+'</span>'; } }

// ===== TV - LIVE FIRST, THEN ADS =====
let tvAds = []; let tvIdx = 0; let tvTimer = null;
function loadTV(){
  let live = null; try{ live = JSON.parse(localStorage.getItem('sokotop_live') || 'null'); }catch(e){}
  if(live && live.link){
    document.getElementById('tvLabel').innerHTML = '<span>🔴 LIVE NOW</span><span>LIVE</span>'; document.getElementById('tvLabel').classList.add('live');
    let url = live.link;
    if(url.includes('youtube.com/watch') || url.includes('youtu.be/')){ let vid = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop(); url = 'https://www.youtube.com/embed/' + vid + '?autoplay=1&mute=1'; }
    if(live.stealth){
      document.getElementById('tvScreen').innerHTML = '<div class="stealth-wrap"><iframe src="'+url+'" allow="autoplay; encrypted-media" allowfullscreen></iframe><div class="stealth-top"><b>SOKOTOP LIVE</b><span class="stealth-live">🔴 LIVE</span></div><div class="stealth-bottom"><span>SOKOTOP - Kitui Live</span></div><div class="stealth-logo">SOKOTOP</div></div>';
    } else {
      document.getElementById('tvScreen').innerHTML = '<iframe src="'+url+'" style="width:100%;height:300px;border:0" allowfullscreen allow="autoplay"></iframe>';
    }
    document.getElementById('liveInteract').style.display = 'block'; showLiveComments(); return;
  }
  document.getElementById('liveInteract').style.display = 'none';
  try{ tvAds = JSON.parse(localStorage.getItem('sokotop_ads_meta') || '[]'); }catch(e){ tvAds = []; }
  let now = Date.now(); tvAds = tvAds.filter(a => !a.expiresAt || a.expiresAt > now);
  if(!tvAds.length){ document.getElementById('tvScreen').innerHTML = '<div class="waiting-msg">📺 No ads yet - Admin will post soon</div>'; document.getElementById('tvDots').innerHTML=''; return; }
  document.getElementById('tvDots').innerHTML = tvAds.map((a,i) => '<span class="dot '+(i==0?'active':'')+'"></span>').join('');
  showTV(0); if(tvTimer) clearInterval(tvTimer); tvTimer = setInterval(()=>{ tvIdx = (tvIdx+1)%tvAds.length; showTV(tvIdx); }, 8000);
}
function showTV(i){
  let ad = tvAds[i]; if(!ad) return;
  let media = ad.media || ad.image || '';
  document.getElementById('tvScreen').innerHTML = (media.startsWith('data:video') ? '<video src="'+media+'" autoplay muted loop></video>' : '<img src="'+media+'">') + '<div class="tv-info"><h3>'+(ad.title||'Ad')+'</h3><div class="ad-meta">'+(ad.desc||'')+'</div><button onclick="window.open(\'https://wa.me/254'+(ad.phone||'').replace(/^0/,'')+'\')">WhatsApp Seller</button></div>';
  document.getElementById('tvCount').innerText = (i+1) + '/' + tvAds.length;
  document.querySelectorAll('.dot').forEach((d,di)=> d.classList.toggle('active', di==i));
}
renderFeed(); renderMe(); loadTicker(); loadTV();
</script>
</body>
</html>
